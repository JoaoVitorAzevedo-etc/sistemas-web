<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Painel da loja</title>
</head>
<body>
    <h1>Painel da Loja</h1>
    <nav>
        <button onclick="mostrartela('login')">Login</button>
        <button onclick="mostrartela('produtos')">Produtos</button>
        <button onclick="mostrartela('admin')">Admin</button>
        <button onclick="mostrartela('perfil')">Perfil</button>
    </nav>
    <section id="tela-login">
        <h2>Tela Login</h2>
        <form id="form-login">
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            <button type="submit">Entrar</button>
        </form>
    </section>

    <section id="tela-produtos" style="display: none;">
        <h2>Tela Produtos</h2>
        <p>Aqui entrara a lista da API (Aula 4)</p>
    </section>

    <section id="tela-admin" style="display: none;">
        <h2>Area Admin</h2>
        <p>só quem for admin pode acessar (Aula 6)</p>
    </section>

    <section id="tela-perfil" style="display: none;">
        <h2>Perfil</h2>
        <p>Informações do usuário</p>
    <script>
        function mostrartela(nome) {
   const tela = document.querySelectorAll('section');
   tela.forEach(tela => {
    tela.style.display = 'none';
   });

   const telaEscolhida = document.getElementById('tela-' + nome);
   telaEscolhida.style.display = 'block';
    }

        const formLogin = document.getElementById('form-login');
        formLogin.addEventListener('submit', function(evento){
            evento.preventDefault()
            console.log('Formulário enviado'); 
        })
        formLogin.addEventListener('submit', function(evento){
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email:email, senha:senha })
            })
            .then(response => response.json())
            .then(dados => {
                console.log(dados)
            })
        })



    </script>
</body>
</html>
